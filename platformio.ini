; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
extra_scripts = 
	post:scripts/firmware_hash.py
	post:scripts/sign_firmware.py
monitor_speed = 115200
upload_speed = 921600
upload_protocol = esptool
test_build_src = true
lib_deps = 
	bodmer/TFT_eSPI@^2.5.43
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
	lvgl/lvgl@^9.6.0
	throwtheswitch/Unity@^2.6.1
board_build.sdkconfig_options =
    CONFIG_BT_ENABLED=n
    CONFIG_ESP_WIFI_ENABLED=n
build_flags = 
	-I include
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT=1
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=16000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_GFXFF=1
	-DILI9341_2_DRIVER=1
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_INVERSION_ON=1
	-DTOUCH_CS=33

[env:esp32dev_secure]
extends = env:esp32dev
board_build.sdkconfig = sdkconfig.secure
extra_scripts =
	post:scripts/ask_signing_key.py
	post:scripts/firmware_hash.py
	post:scripts/sign_firmware.py
	post:scripts/upload_signed.py
