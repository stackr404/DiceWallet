; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
; Exact versions so a published firmware hash can be reproduced.
; 8.0.0 ships Arduino-ESP32 3.3.12 (and ESP-IDF 5.5.5 for arduino+espidf builds).
platform = platformio/espressif32 @ 8.0.0
board = esp32dev
framework = arduino
extra_scripts =
	post:scripts/firmware_hash.py
monitor_speed = 115200
upload_speed = 921600
upload_protocol = esptool
test_build_src = true
; XPT2046_Touchscreen is pinned to the commit of its v1.4 tag.
lib_deps =
	bodmer/TFT_eSPI@2.5.43
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#d57f64c8b5f2bc5b8d10d121550806eeff7b06d9
	lvgl/lvgl@9.6.0
	throwtheswitch/Unity@2.6.1
build_flags = 
	-I include
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT=1
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=16000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_GFXFF=1
	-DILI9341_2_DRIVER=1
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_INVERSION_ON=1
	-DTOUCH_CS=33

[env:esp32dev_secure]
; Secure Boot v2 needs a bootloader built with CONFIG_SECURE_BOOT. A plain
; `framework = arduino` build links Arduino's prebuilt bootloader and ignores
; any sdkconfig, so this environment builds Arduino as an ESP-IDF component.
; The IDF settings are in sdkconfig.defaults (only read by espidf builds).
; PlatformIO builds the secure bootloader, signs the bootloader, partition
; table and app, and `-t upload` flashes all three.
extends = env:esp32dev
framework = arduino, espidf
board_build.partitions = partitions_secure.csv
extra_scripts =
	pre:scripts/ask_signing_key.py
	post:scripts/firmware_hash.py
	post:scripts/sign_firmware.py
